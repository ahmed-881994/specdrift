version: "3.9"

services:
  specdrift:
      image: ghcr.io/ahmed-881994/specdrift:latest
      ports:
          - "8000:8000"
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 30s                 # Let the app boot before first check