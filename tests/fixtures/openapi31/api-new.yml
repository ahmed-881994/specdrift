openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Fixture API
  version: 1.1.0
paths:
  /users:
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      required:
        - id
        - status
        - email
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - active
            - pending
        profile:
          type: object
          properties:
            displayName:
              type: string
              minLength: 3
webhooks:
  invoice.paid:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: integer
      responses:
        '200':
          description: OK
  user.created:
    post:
      responses:
        '200':
          description: OK
