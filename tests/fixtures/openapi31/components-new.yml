openapi: 3.1.0
info:
  title: Fixture Components
  version: 1.1.0
components:
  schemas:
    Money:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          minimum: 1
        currency:
          type: string
          enum:
            - USD
            - EUR
        scale:
          type: integer
          default: 2
