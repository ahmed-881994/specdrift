swagger: '2.0'
info:
  title: Swagger Fixture API
  version: 1.1.0
host: api.example.com
basePath: /v2
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  api_key:
    type: apiKey
    name: X-API-Key
    in: header
paths:
  /users:
    post:
      operationId: createUser
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/User'
        - name: tags
          in: query
          type: array
          items:
            type: string
          collectionFormat: multi
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/User'
definitions:
  User:
    type: object
    required:
      - id
      - status
      - email
    properties:
      id:
        type: integer
        format: int64
      email:
        type: string
        format: email
      status:
        type: string
        enum:
          - active
          - pending
      name:
        type: string
        minLength: 3
